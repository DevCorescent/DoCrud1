# DoCrud scheduled jobs — the single source of truth.
#
# Every timer, every timeout and every route lives in this one table so that
# "what is scheduled?" is answered by reading one file rather than by grepping
# four systemd units. scripts/cron-scheduler.selftest.ts parses this file and
# fails the build if it names a route that does not exist, if a timeout is
# shorter than the route's own maxDuration, or if a systemd timer exists with
# no row here.
#
# FORMAT (pipe-separated, no spaces around the pipes):
#   name|method|path|timeout_seconds|schedule|description
#
#   name      systemd instance name. Used as docrud-cron@<name>.service.
#             Must match [a-z0-9-]+ — it ends up in a unit name.
#   method    GET or POST. Must be a method the route actually exports.
#   path      Absolute request path, called on 127.0.0.1 (never the public URL).
#   timeout   curl --max-time, in seconds. MUST exceed the route's maxDuration,
#             otherwise the scheduler kills a job the app considers healthy.
#   schedule  systemd OnCalendar expression. UTC — see ops/README.md.
#
# Lines starting with # and blank lines are ignored.

# ── Mail campaign dispatch ────────────────────────────────────────────────────
# maxDuration 60. Safe to overlap: claimCampaign() makes a second concurrent
# invocation report 'skipped' rather than send a duplicate to every recipient.
mail|POST|/api/cron/mail|90|*:0/5|Dispatch scheduled mail campaigns

# ── Recommendation refresh ────────────────────────────────────────────────────
# maxDuration 300 — the longest job here, so the timeout is 330. Safe to
# overlap: the pass is single-flighted and an overlapping call reports 'locked'.
# Every 5 minutes matches the previous vercel.json intent. Because a pass may
# legitimately run close to 5 minutes, systemd will occasionally skip a tick
# rather than start a second copy; that is correct, not a fault. Lengthen this
# to *:0/15 if the journal shows frequent skips.
recommendations|POST|/api/cron/recommendations|330|*:0/5|Recompute stale job recommendations

# ── Account lifecycle ─────────────────────────────────────────────────────────
# DESTRUCTIVE: permanently deletes accounts past their deactivation deadline and
# sends the goodbye email. Daily, off-peak. NOT concurrency-safe on its own (it
# read-modify-writes JSON stores with no lock), so overlap protection here comes
# entirely from systemd + flock. Repeated SEQUENTIAL runs are safe: deletion is
# gated on the deadline and the 7-day warning is gated on
# deactivationWarningEmailSentAt.
account-cleanup|GET|/api/cron/account-cleanup|120|*-*-* 04:17:00|Delete expired deactivated accounts and send warnings

# ── Billing ───────────────────────────────────────────────────────────────────
# Sends plan-renewal reminders (daysAhead=3 by default). Idempotent across
# sequential runs — sendPlanRenewalReminders skips a recipient already present
# in the outbox — but two CONCURRENT runs could both pass that check before
# either writes, so overlap protection matters here too.
billing-reminders|GET|/api/cron/billing/reminders|180|*-*-* 06:23:00|Send plan renewal reminders
