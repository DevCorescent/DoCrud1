<!doctype html><meta charset="utf-8">
<style>
  /* The popup sits on its own surface, so the glass is layered over a tinted
     ground rather than over the page — same material as the panel, same
     restraint. */
  :root { color-scheme: dark; }
  body {
    margin: 0; width: 312px;
    font: 400 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #edeef2;
    background:
      radial-gradient(120% 80% at 0% 0%, rgba(143,176,255,.10), transparent 58%),
      radial-gradient(120% 80% at 100% 100%, rgba(200,163,255,.08), transparent 58%),
      #0e1016;
  }
  header {
    display: flex; align-items: center; gap: 9px;
    padding: 14px 15px; border-bottom: 1px solid rgba(255,255,255,.09);
  }
  .spark {
    width: 16px; height: 16px; border-radius: 50%;
    background: conic-gradient(from 140deg, #8fb0ff, #c8a3ff, #7de0c4, #8fb0ff);
    box-shadow: 0 0 10px rgba(143,176,255,.5);
  }
  .brand { font-weight: 700; letter-spacing: -.01em; font-size: 13px; }
  main { padding: 14px 15px 15px; display: flex; flex-direction: column; gap: 12px; }

  button {
    all: unset; cursor: pointer; text-align: center;
    padding: 10px; border-radius: 11px; font-weight: 650; font-size: 13px;
    transition: background 150ms ease, border-color 150ms ease, transform 120ms ease;
  }
  button:active { transform: scale(.985); }
  .primary {
    background: linear-gradient(180deg, #f6f7fa 0%, #e4e6ec 100%);
    color: #0e1016;
    box-shadow: 0 6px 18px rgba(0,0,0,.3);
  }
  .primary:hover { background: #fff; }
  .ghost {
    border: 1px solid rgba(255,255,255,.14);
    background: linear-gradient(180deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.02) 100%);
    color: #edeef2; font-weight: 500;
  }
  .ghost:hover { border-color: rgba(255,255,255,.26); background: rgba(255,255,255,.09); }

  .status {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 11px; border-radius: 11px;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.04);
    font-size: 11.5px; color: rgba(237,238,242,.68);
  }
  .status i { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: rgba(255,255,255,.3); }
  .status.ok  { border-color: rgba(125,224,196,.26); background: rgba(125,224,196,.09); color: #a9ead6; }
  .status.ok i  { background: #7de0c4; box-shadow: 0 0 8px rgba(125,224,196,.6); }
  .status.bad { border-color: rgba(255,150,150,.26); background: rgba(255,120,120,.09); color: #ffc0c0; }
  .status.bad i { background: #ff9b9b; }
  .status.wait i { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: rgba(237,238,242,.4); }
  input {
    all: unset; padding: 8px 10px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.28);
    font-size: 12px; color: #fff;
  }
  input:focus { border-color: rgba(255,255,255,.3); background: rgba(0,0,0,.4); }
  .note { margin: 0; font-size: 11px; line-height: 1.45; color: rgba(237,238,242,.42); }
  .field { display: flex; flex-direction: column; gap: 5px; }
</style>
<header><span class="spark"></span><span class="brand">Docrud</span>
  <span style="font-size:11px;color:rgba(237,238,242,.45)">Auto-Apply</span></header>
<main>
  <button class="primary" id="fill">Fill this application</button>
  <div class="status wait" id="status"><i></i><span id="statusText">Checking your session…</span></div>
  <button class="ghost" id="open">Open Docrud</button>
  <div class="field">
    <label for="origin">Docrud address</label>
    <input id="origin" spellcheck="false" placeholder="https://docrud.com">
  </div>
  <p class="note">Nothing is ever submitted for you. Answers are filled in, anything
    worth a second look is flagged, and you press the employer’s own submit button.</p>
</main>
<script src="popup.js"></script>
